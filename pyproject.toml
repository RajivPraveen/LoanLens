[project]
name = "loanlens"
version = "0.1.0"
description = "End-to-end mortgage credit-risk platform: data-quality-gated ingestion, dbt star schema, PD and survival models, Monte Carlo stress testing and a profit-based lending policy on Freddie Mac loan-level data"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "MIT"
authors = [{ name = "Rajiv Praveen" }]
keywords = ["credit-risk", "mortgage", "freddie-mac", "stress-testing", "dbt", "duckdb", "xgboost", "survival-analysis"]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "duckdb>=1.1",
    "requests>=2.31",
    "pyyaml>=6",
    "typer>=0.12",
    "great-expectations>=1.2,<2",
    "dbt-core>=1.8,<2",
    "dbt-duckdb>=1.8,<2",
    "scikit-learn>=1.5",
    "xgboost>=2.1",
    "lifelines>=0.29",
    "shap>=0.46",
    "matplotlib>=3.8",
    "plotly>=5.22",
    "joblib>=1.4",
]

[project.urls]
Repository = "https://github.com/RajivPraveen/LoanLens"
Dashboard = "https://rajivpraveen.github.io/LoanLens/reports/dashboard.html"

[project.optional-dependencies]
orchestration = ["dagster>=1.8", "dagster-webserver>=1.8", "dagster-dbt>=0.24"]
postgres = ["psycopg[binary]>=3.1"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
loanlens = "loanlens.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/loanlens"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: end-to-end tests that run dbt / model training"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::FutureWarning",
    "ignore:.*Pandas4Warning.*",
    "ignore:.*keyword-only.*",
]
