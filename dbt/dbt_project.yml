name: loanlens
version: "1.0.0"
config-version: 2
profile: loanlens

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
analysis-paths: ["analyses"]
target-path: "target"
clean-targets: ["target", "dbt_packages", "logs"]

vars:
  # Serious delinquency window (months since first payment) used for the default label.
  default_window_months: 24

models:
  loanlens:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: table
      +schema: intermediate
    marts:
      +materialized: table
      core:
        +schema: core
      analytics:
        +schema: analytics
    reporting:
      # Built after the Python models write their outputs to the `ml` schema.
      +materialized: table
      +schema: reporting
      +tags: ["post_model"]

seeds:
  loanlens:
    +schema: reference
    state_reference:
      +column_types:
        zip3: varchar
        judicial_foreclosure: boolean

tests:
  loanlens:
    +severity: error
