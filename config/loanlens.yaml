# LoanLens configuration.
# `default` holds every setting; each entry in `profiles` is deep-merged on top of it.
# Select a profile with the LOANLENS_PROFILE environment variable (default: freddie).
#
# freddie (default)  real Freddie Mac Single-Family Loan-Level data in data/raw/freddie/
# tiny               small synthetic dataset for the automated tests and CI only

default:
  # Real data by default: no synthetic generation.
  synthetic: null

  fred:
    start: "1990-01-01"
    national_series:
      UNRATE: unemployment_rate
      MORTGAGE30US: mortgage_rate_30y
      USSTHPI: hpi
    state_series:           # "{st}" is replaced by the two-letter state code
      "{st}UR": unemployment_rate
      "{st}STHPI": hpi
    request_pause_seconds: 0.2
    cache_days: 7

  ingest:
    chunk_rows: 2000000     # performance files are validated and loaded in chunks of this size
    alert_webhook_env: LOANLENS_ALERT_WEBHOOK

  modeling:
    default_window_months: 24
    # Out-of-time vintage splits (origination year). The 24-month label needs two years of
    # performance, so vintages after 2023 are never labelled (data runs to 2026-03).
    train_years: [1999, 2011]
    calibration_years: [2012, 2013]
    test_years: [2014, 2023]
    xgb:
      n_estimators: 800
      learning_rate: 0.03
      max_depth: 4
      subsample: 0.8
      colsample_bytree: 0.8
      min_child_weight: 25
      reg_lambda: 5.0
      early_stopping_rounds: 50
    shap_sample: 4000

  survival:
    km_sample: 200000
    cox_sample: 40000
    cox_tv_sample: 10000

  hazard:
    panel_sample_loans: 100000

  stress:
    as_of: latest            # last reporting month in the data, or "YYYY-MM"
    horizon_months: 36
    n_scenarios: 5000
    portfolio_sample: 10000
    seed: 7
    recession_prob_annual: 0.14
    scenario_chunk: 100

  backtest:
    as_of: "2007-12"
    horizon_months: 36
    exclude_start: "2007-01"
    exclude_end: "2010-12"

  profit:
    # Net annual credit margin earned on a performing loan (a guarantee-fee-style spread net of
    # servicing and capital costs). The memo reports sensitivity to this assumption.
    net_margin_annual: 0.005
    horizon_years: 2          # matches the 24-month default window

  fairness:
    min_group_size: 300
    air_threshold: 0.8

profiles:
  # Real Freddie Mac data (Sample dataset: sample_YYYY.zip; Standard quarterly files also work).
  freddie: {}

  # Small synthetic dataset in the Freddie Mac layout, used only by the test-suite and CI
  # (they cannot ship the licensed Freddie Mac files). Never used for reported results.
  tiny:
    synthetic:
      seed: 20240601
      loans_per_quarter: 400
      first_quarter: "2003Q1"
      last_quarter: "2016Q4"
      performance_end: "2018-12"
      states: [CA, TX, FL, NY, OH, AZ]
    modeling:
      train_years: [2003, 2007]
      calibration_years: [2008, 2009]
      test_years: [2010, 2016]
      xgb:
        n_estimators: 150
    survival:
      km_sample: 20000
      cox_sample: 5000
      cox_tv_sample: 1500
    hazard:
      panel_sample_loans: 5000
    stress:
      as_of: "2018-12"
      n_scenarios: 200
      portfolio_sample: 2000
    fairness:
      min_group_size: 50
